[project]
name = "resident-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/server", "packages/*"]

[tool.uv.sources]
resident-core = { workspace = true }
resident-ingest = { workspace = true }
resident-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["resident_core", "resident_ingest", "resident_server"]

[tool.pytest.ini_options]
testpaths = ["apps/server/tests", "packages/core/tests", "packages/ingest/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
