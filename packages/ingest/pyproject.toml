[project]
name = "resident-ingest"
version = "0.1.0"
description = "Importers for Apple Health exports, HealthKit sync payloads, lab documents and FHIR"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "resident-core",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resident_ingest"]
