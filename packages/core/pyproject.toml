[project]
name = "resident-core"
version = "0.1.0"
description = "Domain models, metric catalog and insight calculations for Resident"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resident_core"]
