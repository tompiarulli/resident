[project]
name = "resident-server"
version = "0.1.0"
description = "Resident API and MCP server"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "resident-core",
    "resident-ingest",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "mcp>=2.3",
]

[project.scripts]
resident = "resident_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resident_server"]
